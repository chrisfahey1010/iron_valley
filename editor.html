<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Iron Valley · Level Editor</title>
<style>
  html, body { margin: 0; height: 100%; background: #14161a; color: #e8e4da; font-family: system-ui, sans-serif; overflow: hidden; }
  #toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #1d2026; border-bottom: 1px solid #2c313a; }
  #toolbar h1 { font-size: 14px; margin: 0; color: #e8d98a; letter-spacing: 0.06em; text-transform: uppercase; }
  #toolbar button { background: #2c313a; color: #e8e4da; border: 1px solid #3a404b; border-radius: 5px; padding: 6px 14px; cursor: pointer; font-size: 12px; }
  #toolbar button:hover { background: #3a404b; }
  #toolbar button.primary { background: #3d6b3f; border-color: #4c7a4f; }
  #toolbar .spacer { flex: 1; }
  #toolbar .hint { color: #8b8f98; font-size: 11px; }
  #main { display: flex; height: calc(100vh - 45px); }
  #palette { width: 210px; background: #1d2026; border-right: 1px solid #2c313a; overflow-y: auto; padding: 10px; box-sizing: border-box; }
  #palette h3 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #8b8f98; margin: 14px 0 6px; }
  #palette h3:first-child { margin-top: 0; }
  .tool-btn { display: block; width: 100%; text-align: left; background: #252932; border: 1px solid #343a45; border-radius: 5px; color: #ddd; padding: 6px 8px; margin: 3px 0; cursor: pointer; font-size: 12px; }
  .tool-btn:hover { background: #303642; }
  .tool-btn.active { background: #3d5a3f; border-color: #5a7a5c; color: #eaf7ea; }
  #viewport { flex: 1; position: relative; overflow: hidden; background: #0e1013; }
  #game-canvas { position: absolute; inset: 0; cursor: crosshair; }
  #properties { width: 260px; background: #1d2026; border-left: 1px solid #2c313a; overflow-y: auto; padding: 12px; box-sizing: border-box; }
  #properties h3 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #8b8f98; margin: 0 0 8px; }
  #properties label { display: block; font-size: 11px; color: #b8b4a8; margin-top: 10px; }
  #properties input, #properties select { width: 100%; box-sizing: border-box; margin-top: 3px; padding: 5px 6px; background: #252932; border: 1px solid #343a45; color: #eee; border-radius: 4px; font-size: 12px; }
  #properties button { margin-top: 12px; width: 100%; background: #5a3a3a; color: #ffd9d9; border: 1px solid #7a4646; border-radius: 5px; padding: 7px; cursor: pointer; font-size: 12px; }
  #status { position: absolute; bottom: 8px; left: 10px; font-size: 11px; color: #9aa0aa; pointer-events: none; background: rgba(0,0,0,.4); padding: 3px 8px; border-radius: 4px; }
  .empty-note { color: #6b7079; font-size: 12px; padding: 8px 2px; line-height: 1.5; }
  .deg-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  #properties .deg-row input { width: 64px; margin-top: 0; }
  .deg-dial { flex: 0 0 auto; }
</style>
</head>
<body>
  <div id="toolbar">
    <h1>Iron Valley · Level Editor</h1>
    <button id="save-btn" class="primary">Save</button>
    <button id="reload-btn">Reload</button>
    <button id="reset-btn">Reset</button>
    <div class="spacer"></div>
    <span class="hint" id="status-hint"></span>
  </div>
  <div id="main">
    <div id="palette"></div>
    <div id="viewport">
      <canvas id="game-canvas"></canvas>
      <div id="status"></div>
    </div>
    <div id="properties"></div>
  </div>
  <script type="module" src="/src/editor.js"></script>
</body>
</html>
